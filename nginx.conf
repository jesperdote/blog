server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Served behind a reverse proxy that strips a /blog/ prefix. Without this,
    # nginx's own directory-redirect (e.g. /posts -> /posts/) is generated as an
    # absolute URL from the container's own point of view — losing both the
    # /blog/ prefix and the original https scheme. Relative redirects let the
    # browser resolve correctly against the actual proxied URL instead.
    absolute_redirect off;
}
