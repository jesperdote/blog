{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ config.title }}{% endblock title %}

{% block content %}
<article class="post">
    <h1>{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date(format="%Y-%m-%d") }}</p>
    {{ page.content | safe }}
</article>
{% endblock content %}
